<!-- templates/password_reset.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Восстановление пароля</title>
</head>
<body>
<h2>Восстановление пароля</h2>
<p>Введите ваш email, чтобы получить инструкции по сбросу пароля.</p>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Отправить инструкции</button>
</form>
<p><a href="{% url 'login' %}">Вернуться к входу</a></p>
</body>
</html>
